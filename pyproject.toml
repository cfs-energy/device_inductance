[project]
name = "device_inductance"
version = "3.2.3"
description = "Tokamak core inductance matrices and flux tables"
authors = [{ name = "Commonwealth Fusion Systems", email = "jlogan@cfs.energy" }]
requires-python = ">=3.10, <3.14"
readme = "./README.md"
license = "MIT OR Apache-2.0"
license-files = ["LICEN[CS]E*"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=2,<3",
    "omas>=0.94.0",
    "gmsh>=4.13.1,<5",
    "shapely>=2.1.0,<3",
    "scipy~=1.12",
    "rich>=14.0.0,<15",
    "interpn[pydantic]>=0.8,<0.12",
    "cfsem>=5,<9",
    "pytest~=9.0.2",
]

[dependency-groups]
dev = [
    "pytest-cov==7.1.0",
    "ruff==0.15.12",
    "ty==0.0.34",
    "mktestdocs==0.2.4",
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.6.12",
    "mkdocstrings[python]>=0.29.1",
    "matplotlib>=3.9.1,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ty.rules]
too-many-positional-arguments = "ignore"

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
]

[tool.pytest.ini_options]
addopts = "--cov=src --cov-report=html --cov-report=term-missing --cov-fail-under=95"
