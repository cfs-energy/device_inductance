name: test

on: 
  push:
    branches:
      - release
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Run checks
      run: |
        sudo apt update
        sudo apt install -y gmsh

        # Install
        uv venv --python ${{ matrix.python-version }}
        uv pip install . --group dev

        # Lint and test
        uv run --locked ruff check ./src/device_inductance
        uv run --locked ruff format --check ./src/device_inductance
        uv run --locked ty check ./src/device_inductance
        MPLBACKEND="AGG" uv run --locked pytest ./test
        uv run --locked coverage report

  minimum-numpy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        python-version: '3.11'

    - name: Test with NumPy 1.23.5
      run: |
        sudo apt update
        sudo apt install -y gmsh
        uv venv --python 3.11
        # Tests use repository example data and measure coverage under src/.
        uv pip install -e . --group dev 'numpy==1.23.5'
        # Keep the minimum-version environment instead of syncing to the lockfile.
        MPLBACKEND="AGG" uv run --no-sync pytest ./test
